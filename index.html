<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepEarn - Professional Node Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #070913;
            --card-bg: rgba(20, 27, 45, 0.85);
            --border-glow: rgba(56, 189, 248, 0.2);
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background: radial-gradient(circle at top, #111827 0%, var(--bg-deep) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        body.night-mode-active { background: #000000 !important; }
        body.night-mode-active .phone-frame { background: #050505; border-color: #111; box-shadow: none; }
        body.night-mode-active .brand-title, body.night-mode-active .stat-val { color: #333 !important; }

        .phone-frame {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            width: 100%;
            max-width: 410px;
            height: 750px;
            border-radius: 36px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        .app-header { padding: 25px 20px 10px 20px; text-align: center; }
        .brand-title {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1.5px; }

        .screen-content { flex: 1; padding: 10px 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .section { display: none; width: 100%; }
        .section.active { display: flex; flex-direction: column; align-items: center; }

        .mining-container { position: relative; margin: 15px 0; }
        .circular-btn {
            width: 150px; height: 150px; border-radius: 50%;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; outline: none;
        }
        .circular-btn.active-node { background: linear-gradient(145deg, #059669, #047857); border-color: #34d399; box-shadow: 0 0 35px rgba(16, 185, 129, 0.4); }
        .circular-btn.disabled-node { opacity: 0.5; cursor: not-allowed; border-color: rgba(244, 63, 94, 0.3); }

        .btn-icon { font-size: 30px; margin-bottom: 5px; }
        .btn-text { font-size: 13px; font-weight: 700; color: var(--text-main); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 10px; }
        .stat-card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.04); padding: 12px 14px; border-radius: 14px; text-align: left; }
        .stat-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .stat-val { font-size: 17px; font-weight: 700; color: var(--text-main); margin-top: 4px; }
        .highlight-gold { color: var(--warning) !important; }

        .status-indicator {
            font-size: 12px; font-weight: 600; margin-bottom: 10px; padding: 6px 14px;
            border-radius: 20px; background: rgba(244, 63, 94, 0.1); color: var(--danger);
            border: 1px solid rgba(244, 63, 94, 0.2); text-align: center; width: 100%;
        }
        .status-indicator.ready { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.2); }

        .input-group { width: 100%; margin-bottom: 12px; text-align: left; }
        .input-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; display: block; }
        .text-input { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 16px; border-radius: 12px; color: white; font-size: 14px; outline: none; }
        .action-btn { width: 100%; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; border: none; padding: 13px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 5px; }

        .bottom-nav { background: rgba(11, 15, 25, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.05); height: 70px; display: flex; justify-content: space-around; align-items: center; padding: 0 5px; }
        .nav-item { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        .nav-label { font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="app-header">
            <div class="brand-title">SleepEarn</div>
            <div class="brand-subtitle">Cloud Distributed Node</div>
        </div>

        <div class="screen-content">
            <!-- Home -->
            <div class="section active" id="sec-home">
                <div class="status-indicator" id="conditionStatus">⏳ Checking System...</div>
                <div class="mining-container">
                    <button class="circular-btn disabled-node" id="powerBtn" onclick="toggleMining()" disabled>
                        <span class="btn-icon" id="btnIcon">🔒</span>
                        <span class="btn-text" id="btnText">LOCKED</span>
                    </button>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-title">Active Uptime</div>
                        <div class="stat-val" id="timer">0s</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">Total Points</div>
                        <div class="stat-val highlight-gold" id="points">0</div>
                    </div>
                </div>
            </div>

            <!-- Points -->
            <div class="section" id="sec-points">
                <h2 style="font-size: 18px; margin-bottom: 12px; color: var(--accent-blue);">Mining Metrics</h2>
                <div class="stats-grid" style="grid-template-columns: 1fr;">
                    <div class="stat-card">
                        <div class="stat-title">Reward Rate</div>
                        <div class="stat-val" style="font-size: 14px;">1 Point per 5 Seconds</div>
                    </div>
                    <div class="stat-card" style="margin-top: 8px;">
                        <div class="stat-title">Server Sync Status</div>
                        <div class="stat-val" id="syncStatusText" style="font-size: 14px; color: var(--success);">Connected</div>
                    </div>
                </div>
            </div>

            <!-- Withdraw -->
            <div class="section" id="sec-withdraw">
                <h2 style="font-size: 18px; margin-bottom: 12px; color: var(--warning);">Withdraw Points</h2>
                <div class="input-group">
                    <label class="input-label">Payment Method</label>
                    <select class="text-input" id="payMethod">
                        <option value="jazzcash">JazzCash / EasyPaisa</option>
                        <option value="crypto">USDT Wallet</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="input-label">Account / Wallet Number</label>
                    <input type="text" class="text-input" id="accountNo" placeholder="Enter number">
                </div>
                <button class="action-btn" onclick="requestWithdrawal()">Submit Request</button>
            </div>

            <!-- Profile -->
            <div class="section" id="sec-profile">
                <h2 style="font-size: 18px; margin-bottom: 12px; color: var(--accent-purple);">Node Profile</h2>
                <div class="stat-card" style="width: 100%; margin-bottom: 8px;">
                    <div class="stat-title">Assigned Node ID</div>
                    <div class="stat-val" id="nodeIdDisplay" style="font-size: 13px;">-</div>
                </div>
                <div class="stat-card" style="width: 100%;">
                    <div class="stat-title">Target Device Status</div>
                    <div class="stat-val" style="font-size: 13px; color: var(--success);">Multi-Device Ready</div>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home', this)"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>
            <button class="nav-item" onclick="switchTab('points', this)"><span class="nav-icon">⚡</span><span class="nav-label">Points</span></button>
            <button class="nav-item" onclick="switchTab('withdraw', this)"><span class="nav-icon">💳</span><span class="nav-label">Withdraw</span></button>
            <button class="nav-item" onclick="switchTab('profile', this)"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></button>
        </nav>
    </div>

    <script>
        // ہر فون کے لیے منفرد نوڈ آئی ڈی بنانا تاکہ 5 فون الگ الگ پہچانے جائیں
        let nodeId = localStorage.getItem('se_node_id');
        if (!nodeId) {
            nodeId = 'NODE-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('se_node_id', nodeId);
        }
        document.getElementById('nodeIdDisplay').innerText = nodeId;

        let seconds = parseInt(localStorage.getItem('se_seconds')) || 0;
        let points = parseInt(localStorage.getItem('se_points')) || 0;
        let isMining = false;
        let isCharging = false;

        document.getElementById('timer').innerText = seconds + 's';
        document.getElementById('points').innerText = points;

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById('sec-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        // بیٹری چیک سسٹم
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                evaluateSystem(battery.charging);
                battery.addEventListener('chargingchange', function() { evaluateSystem(battery.charging); });
            });
        } else {
            evaluateSystem(true);
        }

        function evaluateSystem(charging) {
            isCharging = charging;
            let statusEl = document.getElementById('conditionStatus');
            let powerBtn = document.getElementById('powerBtn');
            let btnIcon = document.getElementById('btnIcon');
            let btnText = document.getElementById('btnText');

            if (charging) {
                statusEl.innerText = "✅ Ready: Charger Connected";
                statusEl.className = "status-indicator ready";
                powerBtn.disabled = false;
                powerBtn.classList.remove('disabled-node');
                if (!isMining) { btnIcon.innerText = "🔋"; btnText.innerText = "START NODE"; }
            } else {
                statusEl.innerText = "❌ Locked: Plug in charger";
                statusEl.className = "status-indicator";
                powerBtn.disabled = true;
                powerBtn.classList.add('disabled-node');
                btnIcon.innerText = "🔒"; btnText.innerText = "LOCKED";
                if (isMining) stopMining();
            }
        }

        function toggleMining() {
            if (!isCharging) return;
            isMining = !isMining;
            let powerBtn = document.getElementById('powerBtn');
            let btnIcon = document.getElementById('btnIcon');
            let btnText = document.getElementById('btnText');

            if (isMining) {
                powerBtn.classList.add('active-node');
                btnIcon.innerText = "⚡"; btnText.innerText = "MINING...";
            } else {
                stopMining();
            }
        }

        function stopMining() {
            isMining = false;
            let powerBtn = document.getElementById('powerBtn');
            let btnIcon = document.getElementById('btnIcon');
            let btnText = document.getElementById('btnText');
            powerBtn.classList.remove('active-node');
            btnIcon.innerText = "🔋"; btnText.innerText = "START NODE";
        }

        // ہر سیکنڈ کا لوپ اور سرور پر ڈیٹا سنک کرنا
        setInterval(() => {
            if (isMining && isCharging) {
                seconds++;
                document.getElementById('timer').innerText = seconds + 's';
                if (seconds % 5 === 0) {
                    points += 1;
                    document.getElementById('points').innerText = points;
                }
                localStorage.setItem('se_seconds', seconds);
                localStorage.setItem('se_points', points);

                // سرور کو ڈیٹا بھیجنا (یہاں اپنا Render URL لکھیں جب آپ کا سرور لائیو ہو جائے)
                // fetch('https://your-render-app.onrender.com/sync', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ node_id: nodeId, points: points, seconds: seconds, status: 'Active' })
                // }).catch(err => console.log("Sync error"));
            }
        }, 1000);

        function requestWithdrawal() {
            let acc = document.getElementById('accountNo').value;
            if (!acc) { alert("براہ کرم اکاؤنٹ نمبر درج کریں!"); return; }
            if (points < 50) { alert("کم از کم 50 پوائنٹس درکار ہیں!"); return; }
            alert("ودڈرا ریکوئست جمع ہو گئی ہے!");
            points = 0;
            document.getElementById('points').innerText = points;
            localStorage.setItem('se_points', points);
            document.getElementById('accountNo').value = "";
        }
    </script>
</body>
</html>
