<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepEarn - Distributed Computing Network</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s;
        }

        /* سلیپ موڈ کے لیے بلیک سکرین سائیڈ */
        body.sleep-mode {
            background-color: #000000;
            color: #333333;
        }

        body.sleep-mode .container {
            background: #050505;
            border-color: #111;
            box-shadow: none;
        }

        body.sleep-mode .status-box {
            background: #000;
            border-color: #111;
        }

        body.sleep-mode h1, body.sleep-mode .value, body.sleep-mode .label {
            color: #222 !important;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            text-align: center;
            box-sizing: border-box;
            margin: 20px;
            transition: all 0.3s;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 26px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .status-box {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .status-row:last-child {
            margin-bottom: 0;
        }

        .label {
            color: var(--text-muted);
        }

        .value {
            font-weight: bold;
        }

        #nodeStatus {
            color: var(--danger-color);
        }

        #points {
            color: #facc15;
        }

        .btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-sleep {
            background-color: #64748b;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>SleepEarn</h1>
        <div class="subtitle">Distributed Node Dashboard</div>
        
        <div class="status-box">
            <div class="status-row">
                <span class="label">Charger Status:</span>
                <span class="value" id="chargerStatus">Checking...</span>
            </div>
            <div class="status-row">
                <span class="label">Node Status:</span>
                <span class="value" id="nodeStatus">Waiting for Charger</span>
            </div>
            <div class="status-row">
                <span class="label">Active Time:</span>
                <span class="value" id="timer">0s</span>
            </div>
            <div class="status-row">
                <span class="label">Earned Points:</span>
                <span class="value" id="points">0</span>
            </div>
        </div>

        <button class="btn btn-sleep" id="sleepBtn" onclick="toggleSleepMode()">Enable Sleep Mode</button>
        
        <div class="footer">
            Connect charger to start earning points automatically.
        </div>
    </div>

    <script>
        let seconds = parseInt(localStorage.getItem('se_seconds')) || 0;
        let points = parseInt(localStorage.getItem('se_points')) || 0;
        let isCharging = false;
        let isSleepMode = false;

        document.getElementById('timer').innerText = seconds + 's';
        document.getElementById('points').innerText = points;

        // براؤزر کی بیٹری اور چارجنگ چیک کرنے کا فنکشن
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                updateBatteryState(battery);
                battery.addEventListener('chargingchange', function() {
                    updateBatteryState(battery);
                });
            });
        } else {
            // اگر براؤزر بیٹری API سپورٹ نہ کرے تو ڈائرैक्ट چارجنگ مان لیں یا ٹیسٹ کے لیے آن رکھیں
            isCharging = true;
            document.getElementById('chargerStatus').innerText = "Connected (Simulated)";
            document.getElementById('nodeStatus').innerText = "Running";
            document.getElementById('nodeStatus').style.color = "var(--success-color)";
        }

        function updateBatteryState(battery) {
            isCharging = battery.charging;
            let chargerStatusEl = document.getElementById('chargerStatus');
            let nodeStatusEl = document.getElementById('nodeStatus');

            if (isCharging) {
                chargerStatusEl.innerText = "Plugged In (" + Math.round(battery.level * 100) + "%)";
                chargerStatusEl.style.color = "var(--success-color)";
                nodeStatusEl.innerText = "Running";
                nodeStatusEl.style.color = "var(--success-color)";
            } else {
                chargerStatusEl.innerText = "Unplugged";
                chargerStatusEl.style.color = "var(--danger-color)";
                nodeStatusEl.innerText = "Paused (Plug in charger)";
                nodeStatusEl.style.color = "var(--danger-color)";
            }
        }

        // ہر ایک سیکنڈ کا لوپ - صرف اس وقت چلے گا جب چارجنگ ہو رہی ہو
        setInterval(() => {
            if (isCharging) {
                seconds++;
                document.getElementById('timer').innerText = seconds + 's';
                
                // ہر 5 سیکنڈ پر 1 پوائنٹ ملے گا
                if (seconds % 5 === 0) {
                    points += 1;
                    document.getElementById('points').innerText = points;
                }

                localStorage.setItem('se_seconds', seconds);
                localStorage.setItem('se_points', points);
            }
        }, 1000);

        // سلیپ موڈ آن/آف کرنے کا فنکشن
        function toggleSleepMode() {
            isSleepMode = !isSleepMode;
            let body = document.body;
            let sleepBtn = document.getElementById('sleepBtn');

            if (isSleepMode) {
                body.classList.add('sleep-mode');
                sleepBtn.innerText = "Exit Sleep Mode";
                sleepBtn.style.backgroundColor = "#334155";
            } else {
                body.classList.remove('sleep-mode');
                sleepBtn.innerText = "Enable Sleep Mode";
                sleepBtn.style.backgroundColor = "#64748b";
            }
        }
    </script>
</body>
</html>
