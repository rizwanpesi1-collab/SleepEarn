<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepEarn - Smart Node Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #090d16 0%, #1a1c29 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-glow: rgba(56, 189, 248, 0.2);
            --accent: #38bdf8;
            --success: #10b981;
            --danger: #f43f5e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.4s ease;
        }

        /* Sleep Mode Theme (Pure Black for OLED) */
        body.sleep-mode {
            background: #000000 !important;
            color: #222;
        }

        body.sleep-mode .app-card {
            background: #050505;
            border: 1px solid #111;
            box-shadow: none;
        }

        body.sleep-mode .stat-box {
            background: #0a0a0a;
            border-color: #151515;
        }

        body.sleep-mode h1, 
        body.sleep-mode .stat-value, 
        body.sleep-mode .brand {
            color: #222 !important;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
            transition: all 0.4s ease;
        }

        .header {
            margin-bottom: 25px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Stats Grid */
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--danger);
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px var(--danger);
            transition: 0.3s;
        }

        .status-dot.active {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .points-highlight {
            color: #fbbf24 !important;
            font-size: 18px !important;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-sleep {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-sleep:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-test {
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            padding: 6px;
            margin-top: 5px;
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="app-card" id="appCard">
        <div class="header">
            <div class="brand">SleepEarn</div>
            <div class="tagline">Distributed Passive Cloud Node</div>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <span class="stat-label">Charger Status</span>
                <span class="stat-value" id="chargerStatus">Detecting...</span>
            </div>
            
            <div class="stat-box">
                <span class="stat-label">Node State</span>
                <span class="stat-value">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="nodeStateText">Waiting...</span>
                </span>
            </div>

            <div class="stat-box">
                <span class="stat-label">Active Uptime</span>
                <span class="stat-value" id="timer">0s</span>
            </div>

            <div class="stat-box">
                <span class="stat-label">Total Points</span>
                <span class="stat-value points-highlight" id="points">0</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-sleep" id="sleepBtn" onclick="toggleSleepMode()">🌙 Enable Sleep Mode</button>
            <button class="btn btn-test" onclick="toggleSimulation()">⚡ Test/Simulate Charger</button>
        </div>

        <div class="footer-note">
            Connect charger to automatically mine & sync points 24/7.
        </div>
    </div>

    <script>
        let seconds = parseInt(localStorage.getItem('se_seconds')) || 0;
        let points = parseInt(localStorage.getItem('se_points')) || 0;
        let isCharging = false;
        let isSleepMode = false;
        let isSimulated = false;

        // UI Initialization
        document.getElementById('timer').innerText = seconds + 's';
        document.getElementById('points').innerText = points;

        // Battery API Integration
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                if (!isSimulated) updateBatteryUI(battery.charging, battery.level);
                battery.addEventListener('chargingchange', function() {
                    if (!isSimulated) updateBatteryUI(battery.charging, battery.level);
                });
            });
        } else {
            // Fallback simulation mode if battery API is restricted
            setChargingState(true, "Simulated (Connected)");
        }

        function updateBatteryUI(charging, level) {
            let percent = Math.round(level * 100);
            if (charging) {
                setChargingState(true, `Plugged In (${percent}%)`);
            } else {
                setChargingState(false, "Unplugged");
            }
        }

        function setChargingState(charging, text) {
            isCharging = charging;
            document.getElementById('chargerStatus').innerText = text;
            
            let dot = document.getElementById('statusDot');
            let stateText = document.getElementById('nodeStateText');

            if (charging) {
                dot.classList.add('active');
                stateText.innerText = "Running";
            } else {
                dot.classList.remove('active');
                stateText.innerText = "Paused (Plug in charger)";
            }
        }

        // Manual Simulation Toggle for Testing
        function toggleSimulation() {
            isSimulated = true;
            isCharging = !isCharging;
            if (isCharging) {
                setChargingState(true, "Manual Test (Active)");
            } else {
                setChargingState(false, "Manual Test (Paused)");
            }
        }

        // Core Earning Engine (Runs every 1 second)
        setInterval(() => {
            if (isCharging) {
                seconds++;
                document.getElementById('timer').innerText = seconds + 's';
                
                // Earn 1 point every 5 seconds of active charging
                if (seconds % 5 === 0) {
                    points += 1;
                    document.getElementById('points').innerText = points;
                }

                // Save to LocalStorage
                localStorage.setItem('se_seconds', seconds);
                localStorage.setItem('se_points', points);
            }
        }, 1000);

        // Sleep Mode (OLED Black Screen)
        function toggleSleepMode() {
            isSleepMode = !isSleepMode;
            let body = document.body;
            let sleepBtn = document.getElementById('sleepBtn');

            if (isSleepMode) {
                body.classList.add('sleep-mode');
                sleepBtn.innerText = "☀️ Exit Sleep Mode";
            } else {
                body.classList.remove('sleep-mode');
                sleepBtn.innerText = "🌙 Enable Sleep Mode";
            }
        }
    </script>
</body>
</html>
